<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Setouchi Mirai Kaigi</title>
<style>
  :root{
    --bg:#d0fffb; --navy:#2f3a6b;
    --orange:#e2622b; --yellow:#f5d983; --mint:#86d3b6; --teal:#46737a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Helvetica Neue","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
    background:var(--bg);color:var(--navy);line-height:1.7;
  }
  /* 画面の左右にはみ出した端で横スクロールが出ないようにする(縦方向には影響しない) */
  .page{overflow-x:clip}

  .hero{position:relative;min-height:100vh;overflow:visible}

  /* ★ポイント2: svg は section の高さに収めず、はみ出しを表示する(overflow:visible) */
  .ribbons{
    position:absolute;left:0;top:0;
    width:100%;height:100%;
    overflow:visible;
    z-index:0;
    pointer-events:none;
  }
  .ribbons path{fill:none;stroke-linecap:butt;stroke-linejoin:round}
  .r-orange{stroke:var(--orange);stroke-width:42}
  .r-yellow{stroke:var(--yellow);stroke-width:40;opacity:.85}
  .r-mint{stroke:var(--mint);stroke-width:38;opacity:.8}
  .r-teal{stroke:var(--teal);stroke-width:38;opacity:.95}
  .ribbons{stroke:#fff;stroke-width:46;opacity:.7}
  .ribbons path.draw{
    stroke-dasharray:1;
    stroke-dashoffset:1;
    animation:draw 2.8s cubic-bezier(.65,0,.35,1) forwards;
  }
  @keyframes draw{to{stroke-dashoffset:0}}

  .nav{
    position:absolute;left:24px;right:24px;top:20px;z-index:6;
    height:116px;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 48px;
    border-radius:36px 36px 0 0;
    backdrop-filter:blur(12px);
  }
  .brand{
    display:flex;align-items:center;gap:12px;
    font-size:28px;font-weight:800;letter-spacing:.02em;
    color:var(--navy);text-decoration:none;text-transform:uppercase;
  }
  .brand svg{width:34px;height:34px}
  .menu{
    display:flex;align-items:center;gap:60px;list-style:none;
  }
  .menu a{
    position:relative;
    font-size:21px;font-weight:600;
    color:var(--navy);text-decoration:none;
    padding:6px 0;
  }
  .menu a.active::before{
    content:"";position:absolute;left:-26px;right:-26px;top:50%;
    height:20px;transform:translateY(-35%);
    background:radial-gradient(ellipse at center,rgba(130,140,220,.35),transparent 70%);
    z-index:-1;
  }
  .menu a::after{
    content:"";position:absolute;left:0;bottom:-2px;height:2px;width:0;
    background:var(--navy);transition:width .25s;
  }
  .menu a:hover::after{width:100%}
  .lang{
    background:none;border:0;cursor:pointer;color:var(--navy);
    display:grid;place-items:center;margin-left:-20px;
  }
  .lang svg{width:34px;height:34px}

  /* ---------- Responsive ---------- */
  @media (max-width:1100px){
    .menu{gap:28px}
    .menu a{font-size:17px}
    .brand{font-size:22px}
  }
  @media (max-width:760px){
    .nav{height:auto;padding:16px 20px;flex-direction:column;gap:12px;left:12px;right:12px;border-radius:28px 28px 0 0}
    .menu{flex-wrap:wrap;justify-content:center;gap:10px 22px}
    .menu a{font-size:15px}
    .lang{display:none}
    .motion{top:12px;right:12px;font-size:15px;padding:10px 14px}
    .scroll{display:none}
    .headline{top:22vh}
  }
  @media (prefers-reduced-motion:reduce){
    .ribbons g,.scroll::before{animation:none}
  }

  .headline{
    position:absolute; z-index:1;
    left:clamp(24px,6.2vw,120px);top:clamp(200px,60vh,340px);
    font-size:clamp(56px,7.6vw,110px);line-height:1.12;font-weight:700;
  }
  .headline span{display:block}
  .headline span:nth-child(2){padding-left:.9em}

  /* ★ポイント3: 次以降の section は svg より手前に置き、背景は透明にする */
  .introduction {
    position:relative; z-index:1;
    min-height:80vh;
    padding:120px clamp(24px,6.2vw,120px);
    display:flex;align-items:center;
    margin: 200px 0 0 0;
  }

  .btn-flat-border {
  display: inline-block;
  padding: 0.3em 1em;
  text-decoration: none;
  color: #67c5ff;
  border: solid 2px #67c5ff;
  border-radius: 3px;
  transition: .4s;
  text-align: center;
  }
  
  .btn-flat-border:hover,
  .btn-flat-border:focus-visible {
    background: #67c5ff;
    color: white;
  }

  .project{
    position:relative; z-index:1;
    min-height:80vh;
    padding:120px clamp(24px,6.2vw,120px);
    display:flex; align-items:center;
    margin: 200px 0 0 0;
    gap: 1px;
    gap: 400px;
  }
  .project .panel{
    flex: 1;
    max-width:560px;padding:40px 44px;border-radius:28px;
    background:rgba(251,249,247,.7);backdrop-filter:blur(10px);
  }
  .project img {
    max-width: 100%;
    width: 50%;
    height: 50%;
    box-shadow: 4px 4px 6px;
  }


  .sec {
    position:relative; z-index:1;
    min-height:80vh;
    padding:120px clamp(24px,6.2vw,120px);
    display:flex;align-items:center;
    margin: 200px 0 0 0;
  .sec.right{justify-content:flex-end}
  }
  .sec.right {justify-content:flex-end}

  .panel{
    max-width:560px;padding:40px 44px;border-radius:28px;
    background:rgba(251,249,247,.7);backdrop-filter:blur(10px);
  }
  .panel h2{font-size:clamp(32px,4vw,56px);line-height:1.15;margin-bottom:16px}
  .panel p{font-size:18px}
</style>
</head>
<body>
<div class="page">

  <section class="hero">
    <svg class="ribbons" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <!-- 黄色: 右端まで -->
      <g>
        <path class="r-yellow" d="M1220 -10 C900 60 600 180 460 360 C380 470 400 600 470 710 C560 850 750 920 900 970
                                  C1050 1020 1250 1120 1450 1200 C1650 1280 1800 1260 2000 1170"/>
      </g>
      <!-- ミント: 左端まで -->
      <g>
        <path class="r-mint" d="M830 -20 C980 70 1120 190 1145 380 C1165 560 1080 720 900 900 C860 940 830 960 800 985
                                C770 1010 620 1110 450 1150 C300 1190 120 1160 -80 1090"/>
      </g>
      <!-- オレンジ: 右端まで -->
      <g>
        <path class="r-orange" d="M-40 62 C300 40 650 70 1000 130 C1300 190 1520 330 1620 450 C1710 560 1680 760 1640 900 C1620 970 1590 1010 1570 1040
                                  C1550 1070 1550 1160 1660 1200 C1760 1240 1880 1220 2000 1150"/>
      </g>
      <!-- ティール: 左端まで -->
      <g>
        <path class="r-teal" d="M1715 -10 C1715 150 1680 330 1560 500 C1480 610 1420 650 1300 700 C1150 760 1000 800 880 910 C850 940 820 970 790 1000
                                C760 1030 650 1180 480 1260 C330 1330 120 1300 -80 1250"/>
      </g>
    </svg>

    <header class="nav">
    <a class="brand" href="#">
      <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true">
        <rect x="5" y="5" width="30" height="30" rx="6"/>
        <path d="M5 14c10 0 10 12 20 12s10-8 10-8M5 26c10 0 10-12 20-12"/>
      </svg>
      Setouchi Mirai 
    </a>
    <nav aria-label="メインメニュー">
      <ul class="menu">
        <li><a class="active" href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">People</a></li>
        <li><a href="#">Co-Creation</a></li>
        <li><a href="#">News</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>
    <button class="lang" aria-label="言語を切り替え">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6">
        <circle cx="16" cy="16" r="13"/>
        <ellipse cx="16" cy="16" rx="6" ry="13"/>
        <path d="M3 16h26M5 9h22M5 23h22"/>
      </svg>
    </button>
  </header>

    <h1 class="headline"><span>From City to </span><span>Region</span></h1>
  </section>

  <section class="introduction">
    <div class="panel">
        <h2>About Us</h2>
        <p></p>
        <a href="#" class="btn-flat-border">More</a>
    </div>
  </section>
  <section class="project">
    <div class="panel">
      <h2>Project</h2>
      <p>We are doing Regional Revitalization</p>
      <button id="all_project">From Here</button>
    </div>
    <img src="./images/project.jpg" alt="photo">
    
  </section>

  <section class="sec right">
    <div class="panel">
      <h2>Another section</h2>
      <p>sectionの外に出ても、SVGの線はクリップされません。</p>
    </div>
  </section>

</div>
<script>
  (() => {
    /* 線のアニメーション
       1) 読み込み時に、線が始点から画面端まで描かれていく
       2) その後は、線に沿って波がゆっくり流れるように揺れ続ける
          (両端は揺らさないので、画面端まで届いたまま途切れない) */
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const paths = [...document.querySelectorAll('.ribbons path')];
   
    const items = paths.map((p, i) => {
      const len = p.getTotalLength();
      const n = Math.max(12, Math.round(len / 18));       // 約18pxごとに点を取る
      const base = [];
      for (let k = 0; k <= n; k++){
        const pt = p.getPointAtLength(len * k / n);
        base.push([pt.x, pt.y]);
      }
      // 各点の法線(線に垂直な向き)
      const nor = base.map((_, k) => {
        const a = base[Math.max(0, k - 1)], c = base[Math.min(n, k + 1)];
        const dx = c[0] - a[0], dy = c[1] - a[1], l = Math.hypot(dx, dy) || 1;
        return [-dy / l, dx / l];
      });
      const white = p.classList.contains('r-white');
      return { p, n, base, nor,
               amp: white ? 22 : 16,                      // 揺れの大きさ(px)
               phase: i * 1.3,
               speed: white ? 0.5 : 0.7 + (i % 3) * 0.12 };
    });
   
    // 描画アニメーション(順番に少しずつ遅らせる)
    if (!reduce){
      items.forEach((it, i) => {
        it.p.setAttribute('pathLength', '1');
        it.p.style.animationDelay = (i * 0.18) + 's';
        it.p.classList.add('draw');
        it.p.addEventListener('animationend', () => it.p.classList.remove('draw'), { once: true });
      });
    }
   
    function render(t){
      for (const { p, n, base, nor, amp, phase, speed } of items){
        const pts = [];
        for (let k = 0; k <= n; k++){
          const s = k / n, env = Math.sin(Math.PI * s);   // 両端は0、中央ほど大きく揺れる
          const o = (Math.sin(t * speed + s * 7 + phase) * amp
                   + Math.sin(t * speed * 1.7 + s * 13 + phase * 2) * amp * 0.35) * env;
          pts.push([base[k][0] + nor[k][0] * o, base[k][1] + nor[k][1] * o]);
        }
        let d = `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
        for (let k = 1; k < n; k++){
          const mx = (pts[k][0] + pts[k + 1][0]) / 2, my = (pts[k][1] + pts[k + 1][1]) / 2;
          d += ` Q${pts[k][0].toFixed(1)} ${pts[k][1].toFixed(1)} ${mx.toFixed(1)} ${my.toFixed(1)}`;
        }
        d += ` L${pts[n][0].toFixed(1)} ${pts[n][1].toFixed(1)}`;
        p.setAttribute('d', d);
      }
    }
   
    if (reduce) return;                                   // 動きを減らす設定のときは静止
    const t0 = performance.now();
    (function loop(now){
      render((now - t0) / 1000);
      requestAnimationFrame(loop);
    })(t0);
  })();
</script>
</body>
</html>
