<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weave City – Weaving Tomorrow</title>
<style>
  :root{
    --bg:#ede8e4;
    --navy:#2f3a6b;
    --orange:#e2622b;
    --yellow:#f5d983;
    --mint:#86d3b6;
    --teal:#46737a;
    --white:#fbf9f7;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Helvetica Neue","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
    background:var(--bg);
    color:var(--navy);
    overflow-x:hidden;
  }

  /* ---------- Hero ---------- */
  .hero{
    position:relative;
    min-height:100vh;
    overflow:hidden;
  }
  .ribbons{
    position:absolute;inset:0;
    width:100%;height:100%;
  }
  .ribbons path{
    fill:none;
    stroke-linecap:butt;
    stroke-linejoin:round;
  }
  .r-orange{stroke:var(--orange);stroke-width:42}
  .r-yellow{stroke:var(--yellow);stroke-width:40;opacity:.85}
  .r-mint{stroke:var(--mint);stroke-width:38;opacity:.8}
  .r-teal{stroke:var(--teal);stroke-width:38;opacity:.95}
  .r-white{stroke:#fff;stroke-width:46;opacity:.7;filter:blur(3px)}

  .ribbons g{
    animation:drift 14s ease-in-out infinite alternate;
    transform-origin:center;
  }
  .ribbons g:nth-child(2){animation-duration:18s;animation-direction:alternate-reverse}
  .ribbons g:nth-child(3){animation-duration:16s}
  .ribbons g:nth-child(4){animation-duration:20s;animation-direction:alternate-reverse}
  .ribbons g:nth-child(5){animation-duration:12s}
  @keyframes drift{
    from{transform:translate(-14px,6px) rotate(-.4deg)}
    to  {transform:translate(16px,-10px) rotate(.5deg)}
  }
  .paused .ribbons g{animation-play-state:paused}

  /* ---------- Headline ---------- */
  .headline{
    position:absolute;
    left:clamp(24px,6.2vw,120px);
    top:clamp(280px,31vh,340px);
    font-size:clamp(56px,7.6vw,110px);
    line-height:1.12;
    font-weight:700;
    letter-spacing:.01em;
    z-index:2;
  }
  .headline span{display:block}
  .headline span:nth-child(2){padding-left:.9em}

  /* ---------- Motion button ---------- */
  .motion{
    position:absolute;top:150px;right:36px;z-index:5;
    display:flex;align-items:center;gap:12px;
    padding:12px 18px;
    font:500 18px/1 inherit;font-family:inherit;
    color:var(--navy);
    background:rgba(255,255,255,.75);
    border:1px solid #b9bfe6;
    border-radius:12px;
    cursor:pointer;
    backdrop-filter:blur(6px);
    transition:background .2s;
  }
  .motion:hover{background:#fff}
  .motion:focus-visible{outline:3px solid #7b86d8;outline-offset:2px}
  .motion .bars{display:flex;gap:4px}
  .motion .bars i{
    width:8px;height:20px;border:1.5px solid var(--navy);border-radius:3px;
  }
  .paused .motion .bars i:first-child{
    width:0;border-radius:0;border-width:0;
    border-left:16px solid var(--navy);
    border-top:10px solid transparent;border-bottom:10px solid transparent;
    height:0;
  }
  .paused .motion .bars i:last-child{display:none}

  /* ---------- Scroll indicator ---------- */
  .scroll{
    position:absolute;right:96px;bottom:200px;z-index:3;
    display:flex;flex-direction:column;align-items:center;gap:14px;
    font-weight:600;font-size:20px;
    transform:translateX(24px);
  }
  .scroll::before{
    content:"";width:2px;height:60px;background:var(--navy);
    transform-origin:top;
    animation:line 2s ease-in-out infinite;
  }
  .paused .scroll::before{animation-play-state:paused}
  @keyframes line{
    0%{transform:scaleY(0)}
    60%{transform:scaleY(1)}
    100%{transform:scaleY(1);opacity:0}
  }

  /* ---------- Bottom nav pill ---------- */
  .nav{
    position:absolute;left:24px;right:24px;top:20px;z-index:6;
    height:116px;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 48px;
    border-radius:36px 36px 0 0;
    backdrop-filter:blur(12px);
  }
  .brand{
    display:flex;align-items:center;gap:12px;
    font-size:28px;font-weight:800;letter-spacing:.02em;
    color:var(--navy);text-decoration:none;text-transform:uppercase;
  }
  .brand svg{width:34px;height:34px}
  .menu{
    display:flex;align-items:center;gap:60px;list-style:none;
  }
  .menu a{
    position:relative;
    font-size:21px;font-weight:600;
    color:var(--navy);text-decoration:none;
    padding:6px 0;
  }
  .menu a.active::before{
    content:"";position:absolute;left:-26px;right:-26px;top:50%;
    height:20px;transform:translateY(-35%);
    background:radial-gradient(ellipse at center,rgba(130,140,220,.35),transparent 70%);
    z-index:-1;
  }
  .menu a::after{
    content:"";position:absolute;left:0;bottom:-2px;height:2px;width:0;
    background:var(--navy);transition:width .25s;
  }
  .menu a:hover::after{width:100%}
  .lang{
    background:none;border:0;cursor:pointer;color:var(--navy);
    display:grid;place-items:center;margin-left:-20px;
  }
  .lang svg{width:34px;height:34px}

  /* ---------- Responsive ---------- */
  @media (max-width:1100px){
    .menu{gap:28px}
    .menu a{font-size:17px}
    .brand{font-size:22px}
  }
  @media (max-width:760px){
    .nav{height:auto;padding:16px 20px;flex-direction:column;gap:12px;left:12px;right:12px;border-radius:28px 28px 0 0}
    .menu{flex-wrap:wrap;justify-content:center;gap:10px 22px}
    .menu a{font-size:15px}
    .lang{display:none}
    .motion{top:12px;right:12px;font-size:15px;padding:10px 14px}
    .scroll{display:none}
    .headline{top:22vh}
  }
  @media (prefers-reduced-motion:reduce){
    .ribbons g,.scroll::before{animation:none}
  }

  .circle {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    text-align: center;
  }
  .circle .circle-1 {
    position: absolute;
    display: inline-block;
    width: 5000px;
    height: 5000px;
    border-radius: 50%;
    text-align: center;
    border: solid 30px skyblue;
    right: -300px;
    bottom: -40px;

  }
</style>
</head>
<body>
<main class="hero" id="hero">

  <!-- 装飾リボン -->
  <svg class="ribbons" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <!-- 黄色 -->
    <g>
      <path class="r-yellow" d="M1220 -10 C900 60 600 180 460 360 C380 470 400 600 470 710 C560 850 750 920 900 970"/>
    </g>
    <!-- ミント -->
    <g>
      <path class="r-mint" d="M830 -20 C980 70 1120 190 1145 380 C1165 560 1080 720 900 900 C860 940 830 960 800 985"/>
    </g>
    <!-- オレンジ -->
    <g>
      <path class="r-orange" d="M-40 62 C300 40 650 70 1000 130 C1300 190 1520 330 1620 450 C1710 560 1680 760 1640 900 C1620 970 1590 1010 1570 1040"/>
    </g>
    <!-- ネイビー系ティール -->
    <g>
      <path class="r-teal" d="M1715 -10 C1715 150 1680 330 1560 500 C1480 610 1420 650 1300 700 C1150 760 1000 800 880 910 C850 940 820 970 790 1000"/>
    </g>
  </svg>
  <div class="circle">
    <div class="circle-1"></div>
  </div>

  <!-- ナビゲーション -->
  <header class="nav">
    <a class="brand" href="#">
      <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true">
        <rect x="5" y="5" width="30" height="30" rx="6"/>
        <path d="M5 14c10 0 10 12 20 12s10-8 10-8M5 26c10 0 10-12 20-12"/>
      </svg>
      Setouchi Mirai 
    </a>
    <nav aria-label="メインメニュー">
      <ul class="menu">
        <li><a class="active" href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">People</a></li>
        <li><a href="#">Co-Creation</a></li>
        <li><a href="#">News</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>
    <button class="lang" aria-label="言語を切り替え">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6">
        <circle cx="16" cy="16" r="13"/>
        <ellipse cx="16" cy="16" rx="6" ry="13"/>
        <path d="M3 16h26M5 9h22M5 23h22"/>
      </svg>
    </button>
  </header>
  

  <button class="motion" id="motionBtn" aria-pressed="false" aria-label="アニメーションの再生・停止">
    Motion <span class="bars"><i></i><i></i></span>
  </button>

  <h1 class="headline">
    <span>From City to </span>
    <span>Regions</span>
  </h1>

  <div class="scroll" aria-hidden="true">Scroll</div>

  

  
</main>

<script>
  const hero = document.getElementById('hero');
  const btn = document.getElementById('motionBtn');
  btn.addEventListener('click', () => {
    const paused = hero.classList.toggle('paused');
    btn.setAttribute('aria-pressed', String(paused));
  });
</script>
</body>
</html>
